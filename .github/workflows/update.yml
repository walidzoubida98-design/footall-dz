name: تحديث الأخبار تلقائياً

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    
    steps:
      - name: نسخ المستودع
        uses: actions/checkout@v4
      
      - name: إعداد Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: تثبيت المكتبات
        run: pip install --upgrade google-generativeai
      
      - name: تشغيل السكريبت
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python update_news.py
      
      - name: حفظ التغييرات
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "🤖 تحديث تلقائي للأخبار" || echo "لا توجد تغييرات"
          git push
